[package]
name = "settings-daemon"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "Settings daemon basis for TontooOS - store, library manager and socket stubs"
repository = "https://github.com/TontooOS/SettingsDeamon"

[lib]
name = "settings_daemon"
path = "src/lib.rs"

[[bin]]
name = "settings-daemon"
path = "src/main.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
# All TontooOS frameworks (Foundation, NetworkKit, CoreData, FishFile)
# come through the system SDK (local checkout path, `/Library/System/sdk`
# on the target system). No direct framework path dependencies.
sdk = { path = "../../TontooLibs/SDK", features = ["FishFile", "Foundation", "NetworkKit", "CoreData"] }
# Wallpaper backend: decode uploads (png/jpeg/webp) and store PNGs.
# Same version and feature set the compositor uses (shared cargo cache).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
